# =============================================================================
# nftables Baseline Ruleset — Decisions at Scale
# Implements default-deny trust model from Chapter 3.
# Governance decisions implemented:
#   - Only established/related inbound traffic is accepted
#   - Loopback traffic is trusted
#   - ICMP is rate-limited (5/sec)
#   - SSH (port 22) is the only inbound service by default
#   - All drops are logged, rate-limited to prevent log DoS
#
# File: /etc/nftables.conf
# Test: nft -c -f /etc/nftables.conf
# Apply: nft -f /etc/nftables.conf
# =============================================================================

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;
        iif lo accept
        ct state established,related accept
        ip protocol icmp limit rate 5/second accept
        ip6 nexthdr ipv6-icmp limit rate 5/second accept
        tcp dport 22 accept
        log prefix "nftables-input-drop: " limit rate 10/minute
    }
    chain forward {
        type filter hook forward priority 0; policy drop;
        ct state established,related accept
    }
    chain output {
        type filter hook output priority 0; policy accept;
    }
}
